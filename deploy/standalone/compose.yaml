services:
  homeassistant-gateway:
    image: ${GATEWAY_IMAGE:?Set GATEWAY_IMAGE to an immutable gateway image tag or digest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GATEWAY_HOST_PORT:-8099}:8099"
    environment:
      GATEWAY_HOME_ASSISTANT_MODE: standalone
      GATEWAY_HOME_ASSISTANT_URL: ${GATEWAY_HOME_ASSISTANT_URL:?Set the Home Assistant URL reachable from this network}
      GATEWAY_HOME_ASSISTANT_TOKEN: ${GATEWAY_HOME_ASSISTANT_TOKEN:?Set a Home Assistant Long-Lived Access Token}
      GATEWAY_DATA_DIR: /data
      GATEWAY_HOST: 0.0.0.0
      GATEWAY_PORT: 8099
      GATEWAY_OPERATOR_ENABLED: "false"
      GATEWAY_DEVELOPMENT_CONSOLE_ENABLED: "true"
    volumes:
      - gateway-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  gateway-data:
