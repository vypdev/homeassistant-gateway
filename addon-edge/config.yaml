name: Home Assistant Gateway Edge
# Edge images are published from develop for every source/configuration change.
version: "edge"
slug: homeassistant_gateway_edge
image: ghcr.io/vypdev/homeassistant-gateway-edge
description: Development build of the Home Assistant Gateway from the develop branch
url: https://github.com/vypdev/homeassistant-gateway
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: manual
stage: experimental
init: false
ingress: true
ingress_port: 8099
ports:
  8099/tcp: 18100
ports_description:
  8099/tcp: MCP Streamable HTTP (observer-only, development)
panel_icon: mdi:shield-home
panel_title: Gateway Edge
homeassistant_api: true
hassio_api: true
map:
  - data:rw
options:
  log_level: debug
  operator_enabled: false
  development_console_enabled: true
  mcp_allowed_hosts: "localhost,127.0.0.1,[::1],homeassistant,homeassistant.local"
schema:
  log_level: list(trace|debug|info|warning|error|fatal)
  operator_enabled: bool
  development_console_enabled: bool
  mcp_allowed_hosts: str
