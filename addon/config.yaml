name: Home Assistant Gateway
version: "0.5.29"
slug: homeassistant_gateway
description: Secure MCP gateway with observer/operator profiles for Home Assistant
url: https://github.com/vypdev/homeassistant-gateway
image: ghcr.io/vypdev/homeassistant-gateway
arch:
  - amd64
  - aarch64
  - armv7
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
ports:
  8099/tcp: 18099
ports_description:
  8099/tcp: MCP Streamable HTTP (observer-only)
panel_icon: mdi:shield-home
panel_title: Gateway
homeassistant_api: true
hassio_api: true
map:
  - data:rw
options:
  log_level: info
  operator_enabled: false
  development_console_enabled: true
  mcp_allowed_hosts: "localhost,127.0.0.1,[::1],homeassistant,homeassistant.local"
schema:
  log_level: list(trace|debug|info|warning|error|fatal)
  operator_enabled: bool
  development_console_enabled: bool
  mcp_allowed_hosts: str
