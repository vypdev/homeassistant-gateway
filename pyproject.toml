[project]
name = "homeassistant-gateway"
version = "0.4.20"
description = "Home Assistant-native MCP gateway with observer/operator security profiles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "httpx>=0.27,<1.0",
    "mcp>=1.20,<2.0",
]

[project.scripts]
homeassistant-gateway = "homeassistant_gateway.main:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
