[project]
name = "homeassistant-gateway"
version = "0.5.11"
description = "Home Assistant-native MCP gateway with observer/operator security profiles"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.34,<1.0",
    "httpx>=0.27,<1.0",
    "websockets>=15,<18",
    "mcp>=1.20,<2.0",
    "PyYAML>=6.0,<7.0",
]

[project.scripts]
homeassistant-gateway = "homeassistant_gateway.main:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov>=6.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: exercises a local or packaged integration boundary",
    "live: requires an explicitly configured live gateway target",
]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
