name: Release App

on:
  workflow_call:
    inputs:
      version:
        description: Version whose accepted production tag was verified by Copilot
        required: true
        type: string

concurrency:
  group: gateway-stable-image-${{ github.repository_id }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 -c 'import os,re; assert re.fullmatch(r"(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})\.(0|[1-9][0-9]{0,8})", os.environ["RELEASE_VERSION"]), "Invalid release version"'
      - name: Check out accepted production tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false
      - name: Prepare gateway verification
        uses: ./.github/actions/setup-verification
      - name: Verify accepted release metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python -m scripts.prepare_release --check
      - name: Verify accepted gateway
        run: |
          python -m pytest -m "not live" --cov=homeassistant_gateway --cov-fail-under=85
          python scripts/check_app_channels.py
          pnpm --dir frontend run check
          pnpm --dir frontend run build
      - name: Record accepted source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Check immutable stable image
        id: existing
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PRODUCTION_SHA: ${{ steps.source.outputs.sha }}
        run: python -m scripts.release_image

      - name: Build and publish multi-architecture image
        if: steps.existing.outputs.exists == 'false'
        uses: docker/build-push-action@v7
        with:
          context: addon
          file: addon/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            GATEWAY_REF=${{ steps.source.outputs.sha }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.version }}
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ steps.source.outputs.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}

      - name: Verify published image identity and platforms
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          PRODUCTION_SHA: ${{ steps.source.outputs.sha }}
        run: python -m scripts.release_image --require-existing

      - name: Scan published image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ inputs.version }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: 1

      - name: Smoke published image
        env:
          GATEWAY_ARTIFACT_IMAGE: ghcr.io/${{ github.repository }}:${{ inputs.version }}
        run: python scripts/artifact_smoke.py
