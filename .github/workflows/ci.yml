name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"
      - name: Run backend tests
        run: python -m pytest
      - name: Audit Python dependencies
        run: python -m pip install --quiet --upgrade 'setuptools>=83.0.0' pip-audit && python -m pip_audit --skip-editable
      - name: Run live smoke harness (no live target in CI)
        run: python scripts/live_smoke.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Test frontend runtime helpers
        run: npm run test:runtime
      - name: Test frontend UX contracts
        run: npm run test:ux
      - name: Type-check frontend
        run: npm run check
      - name: Check frontend translation coverage
        working-directory: .
        run: python scripts/check_frontend_i18n.py
      - name: Build frontend
        run: npm run build
