name: CI

on:
  pull_request:
    branches:
      - develop
      - main
      - master
  push:
    branches:
      - develop
      - main
      - master

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  copilot-verification-dependencies:
    name: Copilot verification dependencies
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create a fresh verification HOME
        shell: bash
        run: |
          verification_home="$(mktemp -d "$RUNNER_TEMP/copilot-setup-home.XXXXXX")"
          printf 'HOME=%s\n' "$verification_home" >> "$GITHUB_ENV"
      - name: Prepare candidate dependencies
        uses: ./.github/actions/copilot-verification-setup
        timeout-minutes: 5
      - name: Run the configured verification commands
        shell: bash
        run: |
          python3 -m pytest -m 'not live' --cov=homeassistant_gateway --cov-report=term-missing --cov-fail-under=85
          pnpm --dir frontend run test:runtime
          pnpm --dir frontend run test:architecture
          pnpm --dir frontend run test:ux
          pnpm --dir frontend run check
          pnpm --dir frontend run build
          git diff --check
  test:
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"
      - name: Run backend tests with coverage
        run: python -m pytest -m "not live" --cov=homeassistant_gateway --cov-report=term-missing --cov-fail-under=85
      - name: Run standalone fake Home Assistant integration test
        run: python -m pytest -m integration tests/test_fake_home_assistant_integration.py
      - name: Audit Python dependencies
        run: python -m pip install --quiet --upgrade 'setuptools>=83.0.0' pip-audit && python -m pip_audit --skip-editable
      - name: Run live smoke harness (no live target in CI)
        run: python scripts/live_smoke.py
  app-packaging:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Prepare private Docker client
        uses: ./.github/actions/prepare-docker
        timeout-minutes: 2
      - name: Set up packaging Python
        uses: ./.github/actions/setup-release-python
        timeout-minutes: 5
      - name: Install packaging validation dependency
        run: python -m pip install --quiet 'PyYAML>=6.0,<7.0' 'Pillow>=13.0.0,<14.0'
      - name: Validate stable and Edge app contracts
        run: python scripts/check_app_channels.py
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Edge app image from the checked-out develop source
        uses: docker/build-push-action@v7
        with:
          context: .
          file: addon-edge/Dockerfile
          platforms: linux/amd64
          tags: homeassistant-gateway-edge:ci
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/gateway-edge-ci.oci.tar

  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    env:
      FRONTEND_CI_IMAGE: gateway-frontend-ci:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Prepare private Docker client
        uses: ./.github/actions/prepare-docker
        timeout-minutes: 2
      - name: Set up validation Python
        uses: ./.github/actions/setup-release-python
        timeout-minutes: 5
      - name: Enforce pnpm package-manager policy
        run: python scripts/check_package_manager.py
      - name: Check frontend translation coverage
        run: python scripts/check_frontend_i18n.py
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build the Linux browser verification environment
        uses: docker/build-push-action@v7
        timeout-minutes: 15
        with:
          context: .
          file: .github/docker/frontend-ci.Dockerfile
          platforms: linux/arm64
          load: true
          push: false
          tags: ${{ env.FRONTEND_CI_IMAGE }}
      - name: Run all frontend checks in the Linux container
        shell: bash
        run: |
          set -euo pipefail
          container_name="gateway-frontend-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          report_dir="$RUNNER_TEMP/gateway-frontend-reports"
          mkdir -p "$report_dir/test-results" "$report_dir/playwright-report"
          cleanup() {
            docker rm --force "$container_name" >/dev/null 2>&1 || true
            docker image rm "$FRONTEND_CI_IMAGE" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --rm --init --name "$container_name" \
            --cpus=2 --memory=4g --shm-size=1g \
            --mount "type=bind,src=$report_dir/test-results,dst=/workspace/frontend/test-results" \
            --mount "type=bind,src=$report_dir/playwright-report,dst=/workspace/frontend/playwright-report" \
            "$FRONTEND_CI_IMAGE"
      - name: Upload failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-browser-diagnostics-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gateway-frontend-reports
          if-no-files-found: ignore
          retention-days: 7
