name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"
      - name: Run backend tests with coverage
        run: python -m pytest -m "not live" --cov=homeassistant_gateway --cov-report=term-missing --cov-fail-under=85
      - name: Audit Python dependencies
        run: python -m pip install --quiet --upgrade 'setuptools>=83.0.0' pip-audit && python -m pip_audit --skip-editable
      - name: Run live smoke harness (no live target in CI)
        run: python scripts/live_smoke.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Enable pnpm
        run: corepack enable
      - name: Enforce pnpm package-manager policy
        working-directory: .
        run: python scripts/check_package_manager.py
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test frontend runtime helpers
        run: pnpm run test:runtime
      - name: Test frontend UX contracts
        run: pnpm run test:ux
      - name: Type-check frontend
        run: pnpm run check
      - name: Check frontend translation coverage
        working-directory: .
        run: python scripts/check_frontend_i18n.py
      - name: Build frontend
        run: pnpm run build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser smoke
        run: pnpm run test:e2e
