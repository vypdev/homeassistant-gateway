name: CI

on:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, X64, Linux, coolify]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"
      - name: Run backend tests with coverage
        run: python -m pytest -m "not live" --cov=homeassistant_gateway --cov-report=term-missing --cov-fail-under=85
      - name: Audit Python dependencies
        run: python -m pip install --quiet --upgrade 'setuptools>=83.0.0' pip-audit && python -m pip_audit --skip-editable
      - name: Run live smoke harness (no live target in CI)
        run: python scripts/live_smoke.py
  app-packaging:
    runs-on: [self-hosted, X64, Linux, coolify]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install packaging validation dependency
        run: python -m pip install --quiet 'PyYAML>=6.0,<7.0' 'Pillow>=10.0,<13.0'
      - name: Validate stable and Edge app contracts
        run: python scripts/check_app_channels.py
      - name: Build Edge app image from the checked-out develop source
        run: docker build --file addon-edge/Dockerfile --tag homeassistant-gateway-edge:ci .

  frontend:
    runs-on: [self-hosted, X64, Linux, coolify]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Enable pnpm with Corepack
        run: corepack enable && corepack install
      - name: Enforce pnpm package-manager policy
        working-directory: .
        run: python scripts/check_package_manager.py
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test frontend runtime helpers
        run: pnpm run test:runtime
      - name: Check frontend architecture boundaries
        run: pnpm run test:architecture
      - name: Test frontend UX contracts
        run: pnpm run test:ux
      - name: Type-check frontend
        run: pnpm run check
      - name: Check frontend translation coverage
        working-directory: .
        run: python scripts/check_frontend_i18n.py
      - name: Check Storybook types
        run: pnpm run check:storybook
      - name: Build Storybook component catalog
        run: pnpm run storybook:build
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Test Storybook component catalog
        run: pnpm run test:storybook
      - name: Build frontend
        run: pnpm run build
      - name: Run browser smoke against the development server
        run: pnpm run test:e2e
      - name: Start production preview
        run: |
          pnpm exec vite preview --host 127.0.0.1 --port 4174 > /tmp/gateway-vite-preview.log 2>&1 &
          for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:4174/ >/dev/null && exit 0; sleep 1; done
          cat /tmp/gateway-vite-preview.log
          exit 1
      - name: Run browser smoke against the production bundle
        env:
          PW_BASE_URL: http://127.0.0.1:4174
        run: pnpm run test:e2e
