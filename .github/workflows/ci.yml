name: CI

on:
  pull_request:
    branches:
      - develop
      - main
      - master
  push:
    branches:
      - develop
      - main
      - master

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  copilot-verification-dependencies:
    name: Copilot verification dependencies
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Create a fresh verification HOME
        shell: bash
        run: |
          verification_home="$(mktemp -d "$RUNNER_TEMP/copilot-setup-home.XXXXXX")"
          printf 'HOME=%s\n' "$verification_home" >> "$GITHUB_ENV"
      - name: Prepare candidate dependencies
        uses: ./.github/actions/copilot-verification-setup
        timeout-minutes: 5
      - name: Run the configured verification commands
        shell: bash
        run: |
          python3 -m pytest -m 'not live' --cov=homeassistant_gateway --cov-report=term-missing --cov-fail-under=85
          pnpm --dir frontend run test:runtime
          pnpm --dir frontend run test:architecture
          pnpm --dir frontend run test:ux
          pnpm --dir frontend run check
          pnpm --dir frontend run build
          git diff --check
  test:
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[test]"
      - name: Run backend tests with coverage
        run: python -m pytest -m "not live" --cov=homeassistant_gateway --cov-report=term-missing --cov-fail-under=85
      - name: Run standalone fake Home Assistant integration test
        run: python -m pytest -m integration tests/test_fake_home_assistant_integration.py
      - name: Audit Python dependencies
        run: python -m pip install --quiet --upgrade 'setuptools>=83.0.0' pip-audit && python -m pip_audit --skip-editable
      - name: Run live smoke harness (no live target in CI)
        run: python scripts/live_smoke.py
  app-packaging:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Prepare private Docker client
        uses: ./.github/actions/prepare-docker
        timeout-minutes: 2
      - name: Set up packaging Python
        uses: ./.github/actions/setup-release-python
        timeout-minutes: 5
      - name: Install packaging validation dependency
        run: python -m pip install --quiet 'PyYAML>=6.0,<7.0' 'Pillow>=13.0.0,<14.0'
      - name: Validate stable and Edge app contracts
        run: python scripts/check_app_channels.py
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Edge app image from the checked-out develop source
        uses: docker/build-push-action@v7
        with:
          context: .
          file: addon-edge/Dockerfile
          platforms: linux/amd64
          tags: homeassistant-gateway-edge:ci
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/gateway-edge-ci.oci.tar

  frontend:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 30
    # The browser suites use fixed ports; queue runs instead of sharing servers.
    concurrency:
      group: gateway-frontend-browsers-${{ github.repository }}
      cancel-in-progress: false
      queue: max
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up pnpm in the job directory
        uses: pnpm/action-setup@v5
        with:
          version: 11.15.1
          package_json_file: frontend/package.json
          dest: ${{ runner.temp }}/gateway-pnpm
          standalone: false
      - name: Isolate browser downloads in the job directory
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s/gateway-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Enforce pnpm package-manager policy
        working-directory: .
        run: python scripts/check_package_manager.py
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test frontend runtime helpers
        run: pnpm run test:runtime
      - name: Check frontend architecture boundaries
        run: pnpm run test:architecture
      - name: Test frontend UX contracts
        run: pnpm run test:ux
      - name: Type-check frontend
        run: pnpm run check
      - name: Check frontend translation coverage
        working-directory: .
        run: python scripts/check_frontend_i18n.py
      - name: Check Storybook types
        run: pnpm run check:storybook
      - name: Build Storybook component catalog
        run: pnpm run storybook:build
      - name: Install Playwright browsers
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Test Storybook component catalog
        run: pnpm run test:storybook
      - name: Build frontend
        run: pnpm run build
      - name: Run browser smoke against the development server
        run: pnpm run test:e2e
      - name: Run browser smoke against the production bundle
        run: |
          preview_log="$RUNNER_TEMP/gateway-vite-preview.log"
          node node_modules/vite/bin/vite.js preview --host 127.0.0.1 --port 4174 > "$preview_log" 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          preview_ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:4174/ >/dev/null; then
              preview_ready=true
              break
            fi
            sleep 1
          done
          if [ "$preview_ready" != true ]; then cat "$preview_log"; exit 1; fi
          PW_BASE_URL=http://127.0.0.1:4174 pnpm run test:e2e
