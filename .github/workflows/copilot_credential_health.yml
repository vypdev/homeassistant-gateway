name: Copilot - Credential Health

on:
  workflow_dispatch:
    inputs:
      check_pat:
        description: Check the workflow PAT against GitHub
        required: false
        default: false
        type: boolean
      check_openai:
        description: Check OPENAI_API_KEY
        required: false
        default: false
        type: boolean
      check_anthropic:
        description: Check ANTHROPIC_API_KEY
        required: false
        default: false
        type: boolean
      check_google:
        description: Check GOOGLE_API_KEY
        required: false
        default: false
        type: boolean
      check_openrouter:
        description: Check OPENROUTER_API_KEY
        required: false
        default: false
        type: boolean
      check_cursor:
        description: Check CURSOR_API_KEY
        required: false
        default: false
        type: boolean
      check_opencode:
        description: Check OPENCODE_API_KEY
        required: false
        default: false
        type: boolean
      check_codex_api_key:
        description: Check CODEX_API_KEY
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify-pat:
    if: ${{ inputs.check_pat }}
    name: Verify PAT
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    steps:
      - name: Validate PAT without exposing its value
        shell: bash
        env:
          CHECK_PROVIDER: pat
          PAT: ${{ secrets.PAT }}
        run: &validate_credential |
          set -euo pipefail
          header_name=Authorization
          header_prefix='Bearer '
          auth_kind=header
          extra_header=''
          case "$CHECK_PROVIDER" in
            pat)
              credential_name=PAT
              [[ "$GITHUB_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
              urls=(https://api.github.com/user "https://api.github.com/repos/$GITHUB_REPOSITORY") ;;
            openai) credential_name=OPENAI_API_KEY; urls=(https://api.openai.com/v1/models) ;;
            anthropic)
              credential_name=ANTHROPIC_API_KEY; urls=(https://api.anthropic.com/v1/models)
              header_name=x-api-key; header_prefix=''; extra_header='anthropic-version: 2023-06-01' ;;
            google)
              credential_name=GOOGLE_API_KEY; urls=(https://generativelanguage.googleapis.com/v1beta/models)
              header_name=x-goog-api-key; header_prefix='' ;;
            openrouter) credential_name=OPENROUTER_API_KEY; urls=(https://openrouter.ai/api/v1/key) ;;
            cursor)
              credential_name=CURSOR_API_KEY; auth_kind=user
              urls=('https://api.cursor.com/analytics/ai-code/changes?startDate=30d&page=1&pageSize=1') ;;
            opencode) credential_name=OPENCODE_API_KEY; urls=(https://opencode.ai/zen/v1/models) ;;
            codex) credential_name=CODEX_API_KEY; urls=(https://api.openai.com/v1/models) ;;
            *) echo 'Unsupported credential provider.' >&2; exit 1 ;;
          esac
          credential="${!credential_name:-}"
          [[ -n "$credential" && ! "$credential" =~ [[:cntrl:]] ]] || { echo 'Required credential is missing or malformed.' >&2; exit 1; }
          escaped="${credential//\\/\\\\}"
          escaped="${escaped//\"/\\\"}"
          for url in "${urls[@]}"; do
            if ! status="$({
              printf 'url = "%s"\n' "$url"
              if [[ "$auth_kind" == user ]]; then
                printf 'user = "%s:"\n' "$escaped"
              else
                printf 'header = "%s: %s%s"\n' "$header_name" "$header_prefix" "$escaped"
              fi
              if [[ -n "$extra_header" ]]; then printf 'header = "%s"\n' "$extra_header"; fi
            } | env -u "$credential_name" curl --disable --config - --fail --silent --max-time 20 --output /dev/null --write-out '%{http_code}' 2>/dev/null)"; then
              echo 'Credential validation failed.' >&2
              exit 1
            fi
            [[ "$status" =~ ^2[0-9][0-9]$ ]] || { echo 'Credential validation returned an unexpected HTTP status.' >&2; exit 1; }
          done

  verify-openai:
    if: ${{ inputs.check_openai }}
    name: Verify OPENAI_API_KEY
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    steps:
      - name: Validate OpenAI key without exposing its value
        shell: bash
        env:
          CHECK_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: *validate_credential

  verify-anthropic:
    if: ${{ inputs.check_anthropic }}
    name: Verify ANTHROPIC_API_KEY
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    steps:
      - name: Validate Anthropic key without exposing its value
        shell: bash
        env:
          CHECK_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: *validate_credential

  verify-google:
    if: ${{ inputs.check_google }}
    name: Verify GOOGLE_API_KEY
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    steps:
      - name: Validate Google key without exposing its value
        shell: bash
        env:
          CHECK_PROVIDER: google
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: *validate_credential

  verify-openrouter:
    if: ${{ inputs.check_openrouter }}
    name: Verify OPENROUTER_API_KEY
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    steps:
      - name: Validate OpenRouter key without exposing its value
        shell: bash
        env:
          CHECK_PROVIDER: openrouter
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: *validate_credential

  verify-cursor:
    if: ${{ inputs.check_cursor }}
    name: Verify CURSOR_API_KEY
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    steps:
      - name: Validate Cursor key without exposing its value
        shell: bash
        env:
          CHECK_PROVIDER: cursor
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
        run: *validate_credential

  verify-opencode:
    if: ${{ inputs.check_opencode }}
    name: Verify OPENCODE_API_KEY
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    steps:
      - name: Validate OpenCode key without exposing its value
        shell: bash
        env:
          CHECK_PROVIDER: opencode
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: *validate_credential

  verify-codex-api-key:
    if: ${{ inputs.check_codex_api_key }}
    name: Verify CODEX_API_KEY
    runs-on:
      group: vypdev
      labels: [self-hosted, codex, Linux]
    timeout-minutes: 10
    steps:
      - name: Validate Codex API key without exposing its value
        shell: bash
        env:
          CHECK_PROVIDER: codex
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: *validate_credential
