name: Edge App

on:
  push:
    branches:
      - develop
    paths:
      - addon-edge/**
      - frontend/**
      - src/**
      - pyproject.toml
      - poetry.lock
      - scripts/**
      - .dockerignore
      - .github/workflows/edge-app.yml
  workflow_dispatch:

concurrency:
  group: edge-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build Edge (multi-architecture)
    runs-on: [self-hosted, X64, Linux, coolify]

    steps:
      - name: Check out develop source
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 1

      - name: Read Edge development version
        id: edge-version
        shell: bash
        run: |
          version="$(sed -n 's/^version: *"\([^"]*\)"$/\1/p' addon-edge/config.yaml)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish Edge image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: addon-edge/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.edge-version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}-edge:edge
            ghcr.io/${{ github.repository }}-edge:${{ steps.edge-version.outputs.version }}
            ghcr.io/${{ github.repository }}-edge:edge-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.edge-version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge
