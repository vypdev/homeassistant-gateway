name: Edge App

on:
  push:
    branches:
      - develop
    paths:
      - addon-edge/**
      - frontend/**
      - src/**
      - pyproject.toml
      - poetry.lock
      - scripts/**
      - .dockerignore
      - .github/workflows/edge-app.yml
  workflow_dispatch:

concurrency:
  group: edge-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build Edge (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7

    steps:
      - name: Check out develop source
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish Edge image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: addon-edge/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_VERSION=edge
            BUILD_ARCH=${{ matrix.arch }}
          tags: |
            ghcr.io/${{ github.repository }}-edge-${{ matrix.arch }}:edge
            ghcr.io/${{ github.repository }}-edge-${{ matrix.arch }}:edge-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=edge
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=edge-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=edge-${{ matrix.arch }}
