name: Edge App

on:
  push:
    branches:
      - main
    paths:
      - addon-edge/**
      - frontend/**
      - src/**
      - pyproject.toml
      - poetry.lock
      - scripts/**
      - .dockerignore
      - .github/workflows/edge-app.yml
  workflow_dispatch:

concurrency:
  group: edge-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build Edge (multi-architecture)
    runs-on:
      group: vypdev
      labels: [self-hosted, macOS, ARM64]

    steps:
      # Inline because the checkout below intentionally uses main, which may
      # differ from the revision that provides this workflow and its local actions.
      - name: Prepare private Docker client
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          docker version --format 'Docker server: {{.Server.Os}}/{{.Server.Arch}}'
          docker_host="$(docker context inspect --format '{{.Endpoints.docker.Host}}')"
          docker_config="$(mktemp -d "$RUNNER_TEMP/docker-client.XXXXXX")"
          chmod 700 "$docker_config"
          {
            printf 'DOCKER_HOST=%s\n' "$docker_host"
            printf 'DOCKER_CONFIG=%s\n' "$docker_config"
            printf 'DOCKER_CONTEXT=\n'
          } >> "$GITHUB_ENV"

      - name: Check out main source
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: Read Edge development version
        id: edge-version
        shell: bash
        run: |
          version="$(sed -n 's/^version: *"\([^"]*\)"$/\1/p' addon-edge/config.yaml)"
          test -n "$version"
          source_sha="$(git rev-parse HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish Edge image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: addon-edge/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.edge-version.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}-edge:edge
            ghcr.io/${{ github.repository }}-edge:${{ steps.edge-version.outputs.version }}
            ghcr.io/${{ github.repository }}-edge:edge-${{ steps.edge-version.outputs.source_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.edge-version.outputs.version }}
            org.opencontainers.image.revision=${{ steps.edge-version.outputs.source_sha }}
          cache-from: type=gha,scope=edge
          cache-to: type=gha,mode=max,scope=edge
