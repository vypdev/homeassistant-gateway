name: Prepare Gateway verification
description: Install Python tests and the pnpm frontend for the candidate checkout.
runs:
  using: composite
  steps:
    - name: Set up uv for a self-contained Python installation
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: 0.13.5
        enable-cache: false
    - name: Install candidate Python test dependencies in the private profile
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        UV_PYTHON_INSTALL_DIR: ${{ env.HOME }}/verification-python
        UV_CACHE_DIR: ${{ env.HOME }}/uv-cache
      run: |
        uv python install 3.11
        uv venv --managed-python --python 3.11 "$HOME/verification-venv"
        uv pip install --no-cache --python "$HOME/verification-venv/bin/python" '.[test]'
        "$HOME/verification-venv/bin/python" --version
        printf '%s\n' "$HOME/verification-venv/bin" >> "$GITHUB_PATH"
    - name: Set up Node 22
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        package-manager-cache: false
    - name: Set up pnpm in the private profile
      uses: pnpm/action-setup@v5
      with:
        version: 11.15.1
        package_json_file: frontend/package.json
        dest: ${{ env.HOME }}/pnpm
        standalone: false
    - name: Install frontend dependencies from the candidate lockfile
      shell: bash
      working-directory: ${{ github.workspace }}/frontend
      run: pnpm install --frozen-lockfile
